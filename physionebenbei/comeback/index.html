<style>
/* Refinement: lighter Apple-style weights and gesture-first navigation. */
h1,h2,h3{font-weight:600}.btn{font-weight:600}.stat b,.phase strong{font-weight:500}.avatar{font-weight:500}.ring{cursor:grab;touch-action:pan-y}.ring:active{cursor:grabbing}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.choice{min-height:46px;padding:8px 10px;border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}.choice.selected{border-color:rgba(235,240,248,.72);background:rgba(235,240,248,.17);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.close-x{width:38px;height:38px;margin:0;border:1px solid var(--ln);border-radius:50%;background:rgba(255,255,255,.07);color:var(--tx);font:inherit;font-size:22px;line-height:1;cursor:pointer}.custom-range[hidden],.custom-name[hidden]{display:none}
:root{color-scheme:dark;--bg:#08090c;--card:#17191e;--ac:#d8dde5;--ice:#f1f3f6;--tx:#f7f8fa;--mu:#a5aab3;--ln:rgba(235,240,248,.16);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--tx)}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 40% at 50% 0,rgba(225,232,242,.13),transparent 70%),radial-gradient(60% 40% at 100% 70%,rgba(184,194,208,.09),transparent 70%)}main{max-width:520px;margin:auto;padding:14px 18px calc(112px + env(safe-area-inset-bottom))}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.02em}h2{font-size:20px}.mu,.small{color:var(--mu)}.small{font-size:13px}.card{margin-top:14px;padding:18px;border:1px solid var(--ln);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.025) 45%),rgba(23,25,30,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 26px 60px -24px #000;transition:transform .28s ease,background .28s ease}.card:hover{transform:translateY(-2px)}.btn{width:100%;min-height:50px;margin-top:12px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:linear-gradient(180deg,#f7f9fc,#b9c1cc);color:#15171b;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 10px 30px -12px #000,inset 0 1px 0 #fff;transition:transform .2s ease,filter .2s ease}.btn:active{transform:scale(.98)}.btn.alt{background:rgba(255,255,255,.05);border:1px solid var(--ln);color:var(--ice);box-shadow:none}.btn.small{width:auto;min-height:42px;padding:0 15px}.top{display:flex;align-items:center;justify-content:space-between}.avatar{width:46px;height:46px;border:1px solid var(--ln);border-radius:50%;background:linear-gradient(145deg,#eef1f5,#7f8793);color:#1a1c20;font:600 17px inherit;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 8px 20px #0007}.ring-wrap{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px}.ring{position:relative;width:min(78vw,340px);aspect-ratio:1;cursor:pointer;user-select:none;filter:drop-shadow(0 0 34px rgba(218,226,237,.2));transition:transform .35s ease}.ring:hover{transform:scale(1.02)}.ring svg{width:100%;height:100%}.ring-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:23%;gap:4px}.label{font-size:10px;letter-spacing:.18em;color:var(--ice)}.big{font-size:clamp(46px,15vw,68px);font-weight:700;line-height:1;background:linear-gradient(#fff,#b6bec9);-webkit-background-clip:text;color:transparent}.dots{text-align:center;margin-top:8px}.dots i{display:inline-block;width:6px;height:6px;margin:0 3px;border-radius:9px;background:var(--ln);transition:width .3s ease}.dots i.on{width:22px;background:var(--ac)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 12px;border:1px solid var(--ln);border-radius:24px;background:rgba(255,255,255,.055);color:var(--tx);text-align:left;cursor:pointer;transition:transform .22s ease,border-color .22s ease}.stat:hover{transform:translateY(-2px)}.stat[aria-pressed=true]{border-color:rgba(235,240,248,.6);box-shadow:0 0 22px rgba(220,228,239,.14),inset 0 0 0 1px rgba(255,255,255,.15)}.stat b{display:block;font-size:16px}.stat span{display:block;font-size:11px;color:var(--mu)}.mini-ring{width:38px;flex:none}.seg{display:flex;gap:4px;padding:4px;margin-top:10px;border:1px solid var(--ln);border-radius:999px;background:#0006}.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:0;color:var(--mu);font:inherit;font-size:13px;cursor:pointer}.seg button[aria-pressed=true]{background:rgba(230,235,242,.18);color:var(--tx)}label{display:block;margin-top:12px;color:var(--mu);font-size:13px}input,select,textarea{width:100%;min-height:48px;margin-top:5px;padding:0 14px;border:1px solid var(--ln);border-radius:16px;background:#111318;color:var(--tx);font:inherit}textarea{padding:12px;min-height:100px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}.row:first-child{border-top:0}.pill{display:inline-block;padding:2px 9px;border:1px solid var(--ln);border-radius:999px;color:var(--ice);font-size:11px}.error{min-height:18px;color:#ffb4a8;font-size:13px;margin-top:8px}.phase-list{display:grid;gap:8px;margin-top:12px}.phase{padding:12px;border:1px solid var(--ln);border-radius:20px;background:rgba(255,255,255,.045)}.phase.active{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.1)}.phase-head{display:flex;justify-content:space-between;gap:12px}.phase strong{font-size:14px}.phase p{margin-top:5px}.glass-note{padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1px solid var(--ln)}nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:2px;padding:6px;transform:translateX(-50%);border:1px solid var(--ln);border-radius:999px;background:rgba(20,22,27,.78);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 18px 40px #0008}nav button{min-height:46px;padding:0 16px;border:0;border-radius:999px;background:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;transition:background .25s ease,color .25s ease}nav button[aria-current=page]{background:rgba(235,240,248,.16);color:var(--tx)}dialog{width:min(100%,520px);max-width:100%;margin:auto auto 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--ln);border-radius:32px 32px 0 0;background:rgba(24,26,31,.94);color:var(--tx);backdrop-filter:blur(28px)}dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}@media(min-width:600px){dialog{margin:auto;border-radius:32px}}@media(max-width:340px){nav button{padding:0 11px}nav span{display:none}}@media print{nav,.no-print,header{display:none!important}body{background:#fff;color:#000}.card{background:#fff;color:#000;box-shadow:none}}
</style></head>
<body><main id="app"></main><nav id="nav" class="no-print"></nav><dialog id="dialog"></dialog>
<script>
const TYPES={ke:["Kniestreckung","kg","Streckung"],kb:["Kniebeugung","kg","Beugung"],es:["Einbeinsprung","kg","Sprung"]};
const KEY="cb_local",$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let state=null,tab=0,demo=false,view=0;const today=()=>iso(new Date()),fmt=s=>s?new Date(s+"T00:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long"}):"—";function save(){if(!demo)localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}}function demoState(){return{name:"Demo",sport:"Fußball",start:"2026-06-01",end:"2026-12-01",phase:"Laufaufbau",phaseDate:"2026-11-16",tests:[{id:1,type:"ke",date:"2026-08-01",l:31.5,r:39,p:"Handheld-Dynamometer, 90°"},{id:2,type:"ke",date:"2026-10-30",l:35,r:39,p:"Handheld-Dynamometer, 90°"}],questions:[{id:1,text:"Wann darf ich mit Sprints beginnen?",done:false}],next:3}}
function ringSvg(p){let marks="";for(let i=0;i<72;i++){let a=i/72*Math.PI*2,r=i%6?116:112,on=i/72<p;marks+=`<line x1="${130+r*Math.sin(a)}" y1="${130-r*Math.cos(a)}" x2="${130+124*Math.sin(a)}" y2="${130-124*Math.cos(a)}" stroke="${on?"#eef1f5":"#9aa3af"}" stroke-opacity="${on?.9:.22}" stroke-width="${i%6?1.4:2}"/>`}return`<svg viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="94" fill="#d8dde51a"/>${marks}<circle cx="130" cy="130" r="100" fill="none" stroke="#ffffff12" stroke-width="16"/><circle cx="130" cy="130" r="100" fill="none" stroke="#d8dde5" stroke-width="16" stroke-linecap="round" stroke-dasharray="${p*628} 628" transform="rotate(-90 130 130)"/></svg>`}
function sorted(type){return state.tests.filter(x=>x.type===type).sort((a,b)=>a.date.localeCompare(b.date))}function metric(){let a=sorted(state.type||"ke");if(!a.length)return["TESTDIFFERENZ","—","Noch keine Ergebnisse",0];let x=a.at(-1),p=Math.abs(x.l-x.r)/Math.max(x.l,x.r)*100;return["TESTDIFFERENZ",p.toFixed(1)+" %",`Links ${x.l} · Rechts ${x.r} ${TYPES[x.type][1]}`,Math.min(1,p/100)]}function data(){let t=new Date(),s=new Date(state.start+"T00:00:00"),e=new Date((state.end||today())+"T00:00:00"),days=Math.max(0,Math.floor((t-s)/864e5)+1),period=Math.max(0,Math.floor((e-s)/864e5)),m=metric();return[["DEIN REHA-TAG",String(days),`Seit ${fmt(state.start)}`,1],["DEIN GEPLANTER ZEITRAUM",period?Math.round(Math.min(1,days/period)*100)+" %":"—",`${Math.min(days,period)} von ${period} Tagen`,period?Math.min(1,days/period):0],m,["DEINE NÄCHSTE PHASE",state.phase||"Noch offen",state.phaseDate?`Geplant · ${fmt(state.phaseDate)} · keine Freigabe`:"Phase eintragen",1]][view]}
function overview(){let d=data(),all=[0,1,2,3].map((_,i)=>{let old=view;view=i;let x=data();view=old;return x});return`<div class="ring-wrap"><button class="btn small alt no-print" id="prev">‹</button><div class="ring" id="ring" role="button" tabindex="0">${ringSvg(+d[3]||0)}<div class="ring-content"><span class="label">${d[0]}</span><b class="big">${esc(d[1])}</b><span class="small">${esc(d[2])}</span></div></div><button class="btn small alt no-print" id="next">›</button></div><div class="dots">${all.map((_,i)=>`<i class="${i===view?"on":""}"></i>`).join("")}</div><div class="grid">${all.map((x,i)=>`<button class="stat" data-view="${i}" aria-pressed="${i===view}"><span class="mini-ring">${ringSvg(x[3])}</span><div><span>${x[0].replace("DEIN ","")}</span><b>${esc(x[1])}</b></div></button>`).join("")}</div><div class="card"><h3>Verlauf · ${TYPES[state.type||"ke"][0]}</h3>${chart()}</div><div class="card"><h3>Offene Gesprächsfragen</h3>${state.questions.filter(q=>!q.done).map(q=>`<p class="small" style="margin-top:8px">· ${esc(q.text)}</p>`).join("")||'<p class="small">Keine offenen Fragen.</p>'}<button class="btn alt small" id="questions">Fragen verwalten</button></div><button class="btn" id="add">Ergebnis hinzufügen</button><p class="small" style="margin:12px 0;text-align:center">Eigene Dokumentation · kein ärztlicher Befund · keine Sportfreigabe</p>`}
function phaseData(){return state.phases||[]}
function phaseCard(){let phases=phaseData();return`<div class="card"><div class="phase-head"><div><span class="label">REHA-PLAN</span><h3 style="margin-top:8px">${esc(state.phase||"Noch keine Phase gespeichert")}</h3></div><button class="btn alt small" id="phaseAdd">+ Phase</button></div><div class="phase-list">${phases.map(p=>`<div class="phase ${p.name===state.phase?"active":""}"><div class="phase-head"><strong>${esc(p.name)}</strong><span class="pill">${esc(p.weeks)}</span></div><p class="small">Belastung: ${esc(p.load)}<br>Bewegung: ${esc(p.rom)}</p><p class="small mu">${esc(p.note||"")}</p></div>`).join("")||'<p class="small">Noch keine Phase angelegt. Lege deine Woche, Belastung und Bewegungsgrenzen selbst fest.</p>'}</div>${state.tests.length?`<div style="margin-top:14px">${interpretation()}</div>`:""}</div>`}
function interpretation(){let m=metric(),p=parseFloat(String(m[1]).replace('%','').replace(',','.'));let tone=p<10?'stabil':p<20?'beobachten':'auffällig';return`<div class="glass-note"><strong>Automatische Einordnung · ${tone}</strong><p class="small" style="margin-top:5px">Aus dem letzten Messwert: ${esc(m[2])}. Lokale Orientierung aus deinen Eingaben – kein KI-Befund und keine Belastungs- oder Sportfreigabe.</p></div>`}
function phaseDialog(){dialog(`<div class="dialog-head"><h2>Reha-Phase speichern</h2><button type="button" class="close-x" onclick="dialog.close()" aria-label="Abbrechen">×</button></div><p class="small" style="margin-top:6px">Wähle Zeitraum, Belastung und Bewegung aus.</p><form id="phaseForm"><label>Phasenname<input name="name" placeholder="z. B. Schutzphase" required></label><label>Zeitraum</label><div class="choice-grid">${['Woche 1–2','Woche 3–4','Woche 5–6','Woche 7–8','Eigener Zeitraum'].map(x=>`<button type="button" class="choice" data-weeks="${x}">${x}</button>`).join('')}</div><input type="hidden" name="weeks" required><div class="custom-range" hidden><label>Eigener Zeitraum<input name="customWeeks" placeholder="z. B. Woche 1–6"></label></div><label>Belastung</label><div class="choice-grid">${['Entlastung','Teilbelastung','Vollbelastung','Nach Freigabe'].map(x=>`<button type="button" class="choice" data-load="${x}">${x}</button>`).join('')}</div><input type="hidden" name="load" required><label>Bewegung</label><div class="choice-grid">${['Keine Bewegung','Begrenzt','Freie Bewegung','Nach Freigabe'].map(x=>`<button type="button" class="choice" data-rom="${x}">${x}</button>`).join('')}</div><input type="hidden" name="rom" required><label>Notiz<textarea name="note" placeholder="Was soll ich beachten?"></textarea></label><p class="error" id="phaseError"></p><button class="btn">Phase speichern</button></form>`);$$('[data-weeks]').forEach(b=>b.onclick=()=>{pickChoice('[data-weeks]',b);$('[name=weeks]').value=b.dataset.weeks;$('.custom-range').hidden=b.dataset.weeks!=='Eigener Zeitraum';$('[name=customWeeks]').required=b.dataset.weeks==='Eigener Zeitraum'});$$('[data-load]').forEach(b=>b.onclick=()=>{pickChoice('[data-load]',b);$('[name=load]').value=b.dataset.load});$$('[data-rom]').forEach(b=>b.onclick=()=>{pickChoice('[data-rom]',b);$('[name=rom]').value=b.dataset.rom});$('#phaseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),weeks=f.get('weeks')==='Eigener Zeitraum'?f.get('customWeeks').trim():f.get('weeks'),p={id:Date.now(),name:f.get('name').trim(),weeks,load:f.get('load'),rom:f.get('rom'),note:f.get('note').trim()};if(!p.weeks||!p.load||!p.rom)return $('#phaseError').textContent='Bitte Zeitraum, Belastung und Bewegung auswählen.';state.phases=phaseData().concat(p);state.phase=p.name;save();$('#dialog').close();render()}}
function pickChoice(selector,button){document.querySelectorAll(selector).forEach(x=>x.classList.remove('selected'));button.classList.add('selected')}
function chart(){let a=sorted(state.type||"ke");if(!a.length)return'<p class="small" style="margin-top:10px">Noch keine Ergebnisse.</p>';return`<div class="seg">${Object.entries(TYPES).map(([k,v])=>`<button data-type="${k}" aria-pressed="${(state.type||"ke")===k}">${v[2]}</button>`).join("")}</div>${a.slice().reverse().map(x=>`<div class="row"><div><b>${fmt(x.date)}</b><p class="small">L ${x.l} · R ${x.r} ${TYPES[x.type][1]}<br>${esc(x.p)}</p></div><span class="pill">${TYPES[x.type][0]}</span></div>`).join("")}`}
function results(){return`<div class="card"><h3>Verlauf & Ergebnisse</h3>${chart()}</div><button class="btn" id="add">Ergebnis hinzufügen</button><div class="card"><h3>Offene Gesprächsfragen</h3>${state.questions.filter(q=>!q.done).map(q=>`<p class="small" style="margin-top:8px">· ${esc(q.text)}</p>`).join("")||'<p class="small">Keine offenen Fragen.</p>'}<button class="btn alt small" id="questions">Fragen verwalten</button></div>`}function pass(){return`<div class="card"><span class="label">COMEBACK-PASS</span><h1 style="margin-top:28px">${esc(state.name)}</h1><p class="mu">${esc(state.sport)} · Stand ${fmt(today())}</p></div><div class="card"><h3>Planangaben</h3><p class="small" style="margin-top:8px">Reha-Start: ${fmt(state.start)}<br>Geplantes Ende: ${fmt(state.end)}<br>Nächste Phase: ${esc(state.phase||"—")}</p></div><button class="btn no-print" onclick="print()">Als PDF speichern / Drucken</button>`}
function render(){if(!state){$('#nav').innerHTML="";$('#app').innerHTML=`<header><h1>COMEBACK</h1></header><div style="width:260px;margin:10px auto">${ringSvg(.72)}</div><div class="card"><h2>Dein Stand. In Sekunden.</h2><p class="mu" style="margin:8px 0 16px">Dokumentierte Ergebnisse und offene Fragen auf einen Blick.</p><button class="btn" id="demo">Demo ansehen</button><p class="small" style="margin-top:8px">Flüchtige Demo mit gekennzeichneten Beispieldaten.</p><form id="profile"><h3 style="margin-top:20px">Lokales Testprofil</h3><label>Vorname / Pseudonym<input name="name" maxlength="30" required></label><label>Sport<input name="sport" maxlength="30" required></label><label>Reha-Start<input type="date" name="start" required></label><label><input type="checkbox" name="ok" required style="width:24px;min-height:24px;margin-right:8px">Nur fiktive Testdaten verwenden.</label><button class="btn alt">Testprofil anlegen</button></form></div>`;$('#demo').onclick=()=>{demo=true;state=demoState();render()};$('#profile').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);demo=false;state={name:f.get('name').trim(),sport:f.get('sport').trim(),start:f.get('start'),end:"",phase:"",phaseDate:"",phases:[],type:"ke",tests:[],questions:[],next:1};save();render()};return}let titles=["Dein Stand","Ergebnisse","Mein Pass"];$('#nav').innerHTML=titles.map((x,i)=>`<button data-tab="${i}" ${tab===i?'aria-current="page"':''}>${x}</button>`).join("");$('#app').innerHTML=`<header class="top"><div><p class="small">${demo?'Demo':'Lokales Testprofil'} · ${esc(state.name)}</p><h1>${titles[tab]}</h1></div><button class="avatar" id="settings">${esc(state.name[0]?.toUpperCase()||'?')}</button></header>${tab===0?overview():tab===1?results():pass()}${tab===0?phaseCard():''}`;bind()}
function dialog(html){let d=$('#dialog');d.innerHTML=html;d.showModal()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=+b.dataset.view;render()});$('#prev')?.addEventListener('click',()=>{view=(view+3)%4;render()});$('#next')?.addEventListener('click',()=>{view=(view+1)%4;render()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;save();render()});$('#add')?.addEventListener('click',()=>testDialog());$('#phaseAdd')?.addEventListener('click',phaseDialog);$('#questions')?.addEventListener('click',questionDialog);$('#settings')?.addEventListener('click',settings)}
function testDialog(){dialog(`<div class="dialog-head"><h2>Ergebnis hinzufügen</h2><button type="button" class="close-x" onclick="dialog.close()" aria-label="Abbrechen">×</button></div><form id="test"><label>Testart<select name="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]} (${v[1]})</option>`).join("")}</select></label><label>Datum<input type="date" name="date" value="${today()}" required></label><label>Links (kg)<input name="left" inputmode="decimal" placeholder="z. B. 35" required></label><label>Rechts (kg)<input name="right" inputmode="decimal" placeholder="z. B. 38" required></label><label>Testprotokoll<input name="protocol" maxlength="120" placeholder="z. B. 90° Position" required></label><p class="error" id="error"></p><button class="btn">Speichern</button></form>`);$('#test').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),l=+String(f.get('left')).replace(',','.'),r=+String(f.get('right')).replace(',','.');if(!isFinite(l)||!isFinite(r)||l<0||r<0)return $('#error').textContent='Bitte gültige kg-Werte eingeben.';state.tests.push({id:Date.now(),type:f.get('type'),date:f.get('date'),l,r,p:f.get('protocol').trim()});state.type=f.get('type');save();$('#dialog').close();render()}}
function questionDialog(){dialog(`<div class="dialog-head"><h2>Gesprächsfragen</h2><button type="button" class="close-x" onclick="dialog.close()" aria-label="Abbrechen">×</button></div><div id="ql">${state.questions.map(q=>`<div class="row"><label style="color:var(--tx)"><input type="checkbox" data-q="${q.id}" ${q.done?'checked':''} style="width:24px;min-height:24px;margin-right:8px">${esc(q.text)}</label><button class="btn alt small" data-remove="${q.id}">✕</button></div>`).join("")||'<p class="small">Keine Fragen.</p>'}</div><form id="question"><input name="text" placeholder="Neue Frage" required><button class="btn">Hinzufügen</button></form>`);$('#question').onsubmit=e=>{e.preventDefault();let t=new FormData(e.target).get('text').trim();state.questions.push({id:Date.now(),text:t,done:false});save();questionDialog()};$$('[data-q]').forEach(x=>x.onchange=()=>{state.questions.find(q=>q.id==x.dataset.q).done=x.checked;save()});$$('[data-remove]').forEach(x=>x.onclick=()=>{state.questions=state.questions.filter(q=>q.id!=x.dataset.remove);save();questionDialog()})}
function settings(){dialog(`<h2>Profil & Einstellungen</h2><p class="small" style="margin:6px 0 12px">${demo?'Flüchtige Demo.':'Nur in diesem Browser gespeichert.'}</p><button class="btn alt" id="reset">Zur Startseite</button><button class="btn alt" id="delete">Lokale Daten löschen</button><details style="margin:14px 0"><summary class="small">Datenschutzhinweis</summary><p class="small" style="margin-top:6px">Diese Vorschau überträgt nichts an einen Server. Für echte Gesundheitsdaten fehlen noch Konten, Anmeldung, serverseitige Speicherung und Löschung.</p></details><button class="btn" onclick="dialog.close()">Schließen</button>`);$('#reset').onclick=()=>{state=null;demo=false;localStorage.removeItem(KEY);$('#dialog').close();render()};$('#delete').onclick=()=>{localStorage.removeItem(KEY);state=null;demo=false;$('#dialog').close();render()}}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
/* Final interaction layer for the current compact build. */
function overview(){let d=data(),all=[0,1,2,3].map((_,i)=>{let old=view;view=i;let x=data();view=old;return x});return`<div class="ring-wrap"><div class="ring" id="ring" role="button" tabindex="0" aria-label="Wischen für nächsten Standwert">${ringSvg(+d[3]||0)}<div class="ring-content"><span class="label">${d[0]}</span><b class="big">${esc(d[1])}</b><span class="small">${esc(d[2])}</span></div></div></div><p class="small" style="text-align:center;margin-top:2px">Wischen, um den nächsten Wert zu sehen</p><div class="dots">${all.map((_,i)=>`<i class="${i===view?"on":""}"></i>`).join("")}</div><div class="grid">${all.map((x,i)=>`<button class="stat" data-view="${i}" aria-pressed="${i===view}"><span class="mini-ring">${ringSvg(x[3])}</span><div><span>${x[0].replace("DEIN ","")}</span><b>${esc(x[1])}</b></div></button>`).join("")}</div><button class="btn" id="add">Ergebnis hinzufügen</button><p class="small" style="margin:12px 0;text-align:center">Eigene Dokumentation · kein ärztlicher Befund · keine Sportfreigabe</p>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=+b.dataset.view;render()});let ring=$('#ring'),startX=0;ring?.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});ring?.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>35){view=(view+(dx<0?1:3))%4;render()}},{passive:true});ring?.addEventListener('pointerdown',e=>{startX=e.clientX});ring?.addEventListener('pointerup',e=>{let dx=e.clientX-startX;if(Math.abs(dx)>35){view=(view+(dx<0?1:3))%4;render()}});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;save();render()});$('#add')?.addEventListener('click',()=>testDialog());$('#phaseAdd')?.addEventListener('click',phaseDialog);$('#questions')?.addEventListener('click',questionDialog);$('#settings')?.addEventListener('click',settings)}
function upgradeProfile(){let f=$('#profile');if(!f||f.dataset.upgraded)return;f.dataset.upgraded='true';f.innerHTML=`<h3 style="margin-top:20px">Konto einrichten</h3><p class="small" style="margin-top:6px">Wähle die passenden Angaben aus – du musst nur Sonderfälle eintippen.</p><label>Wie möchtest du angesprochen werden?</label><div class="choice-grid">${['Alex','Chris','Sam','Eigenen Namen eingeben'].map(x=>`<button type="button" class="choice" data-name="${x}">${x}</button>`).join('')}</div><input type="hidden" name="name" required><input name="customName" class="custom-name" maxlength="30" placeholder="Dein Name oder Pseudonym" hidden><label>Dein Sport</label><div class="choice-grid">${['Fußball','Laufen','Tennis','Fitness','Andere Aktivität'].map(x=>`<button type="button" class="choice" data-sport="${x}">${x}</button>`).join('')}</div><input type="hidden" name="sport" required><label>Reha-Start<input type="date" name="start" required></label><label><input type="checkbox" name="ok" required style="width:24px;min-height:24px;margin-right:8px">Nur fiktive Testdaten verwenden.</label><button class="btn alt">Testprofil anlegen</button>`;$$('[data-name]').forEach(b=>b.onclick=()=>{$$('[data-name]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');let input=$('[name=name]'),custom=$('[name=customName]');if(b.dataset.name==='Eigenen Namen eingeben'){custom.hidden=false;custom.required=true;custom.focus();input.value=''}else{custom.hidden=true;custom.required=false;input.value=b.dataset.name}});$$('[data-sport]').forEach(b=>b.onclick=()=>{$$('[data-sport]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('[name=sport]').value=b.dataset.sport});f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),name=d.get('customName')?.trim()||d.get('name');if(!name||!d.get('sport'))return;demo=false;state={name,sport:d.get('sport'),start:d.get('start'),end:"",phase:"",phaseDate:"",phases:[],type:"ke",tests:[],questions:[],next:1};save();render()}}
const profileObserver=new MutationObserver(upgradeProfile);profileObserver.observe($('#app'),{childList:true,subtree:true});load();render();upgradeProfile();
</script></body></html>
